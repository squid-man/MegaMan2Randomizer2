name: Dotnet
on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    types:
      - opened
      - synchronize
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        dotnet: ['10.0.x']
    name: Dotnet ${{ matrix.dotnet }} - ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: Setup dotnet
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - run: dotnet build RandomizerHost.Desktop/RandomizerHost.Desktop.csproj
      - run: dotnet test tests\MM2RandoLib.Tests\MM2RandoLib.Tests.csproj --configuration Debug
      - run: dotnet test tests\MM2RandoLib.Tests\MM2RandoLib.Tests.csproj --configuration Release
      - run: dotnet publish --runtime osx-x64 --configuration Release
      - run: dotnet publish --runtime linux-x64 --configuration Release
      - run: dotnet publish --runtime win-x64 --configuration Release
